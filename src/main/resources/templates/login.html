<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link rel="stylesheet"
          type="text/css"
          th:href="@{/webjars/bootstrap/5.1.3/css/bootstrap.min.css}">

    <script type="text/javascript"
            th:src="@{/webjars/bootstrap/5.1.3/js/bootstrap.min.js}"></script>

    <script type="text/javascript"
            th:src="@{/webjars/jquery/3.6.0/jquery.min.js}"></script>
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div align="center">
        <h3>Welcome to Employee Self Service Portal</h3>
    </div>
</nav>

<br>
<br>
<br>

<div class="row align-items-center">

    <div class="col">
        <img th:src="@{/pictures/myimg.jpg}"
             width="700px"
             class="rounded float-start"
             alt="Image">
    </div>

    <div class="col container">

        <div class="border border-secondary rounded p-3"
             style="max-width:400px; margin:0 auto">

            <div th:if="${message != null}"
                 class="alert alert-success text-center">
                [[${message}]]
            </div>

            <div th:if="${param.error}"
                 class="alert alert-danger text-center">
                Invalid Employee ID or Password
            </div>

            <div th:if="${param.logout}"
                 class="alert alert-success text-center">
                You have been logged out successfully.
            </div>

            <form th:action="@{/adminlogin}"
                  method="post">

                <h3>Login</h3>

                <div class="form-outline mb-4">

                    <label class="form-label"
                           for="username">
                        Employee Id
                    </label>

                    <input type="text"
                           name="username"
                           id="username"
                           class="form-control"
                           required>
                </div>

                <div class="form-outline mb-4">

                    <label class="form-label"
                           for="password">
                        Password
                    </label>

                    <input type="password"
                           name="password"
                           id="password"
                           class="form-control"
                           required>
                </div>

                <!-- CSRF token -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="text-center">

                    <input type="submit"
                           class="btn btn-primary mb-4"
                           value="Sign In">

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
