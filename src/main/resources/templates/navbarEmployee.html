<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <title>Employee Navbar</title>

  <link rel="stylesheet"
        type="text/css"
        th:href="@{/webjars/bootstrap/5.1.3/css/bootstrap.min.css}">

  <script type="text/javascript"
          th:src="@{/webjars/bootstrap/5.1.3/js/bootstrap.min.js}"></script>

  <style>

    .navbar-light .navbar-nav .nav-link {
        color: white;
    }

  </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-primary static-top">

  <div class="container-fluid">

    <a class="navbar-brand"
       th:href="@{'/employees/empprofile/view/' + ${employee.employeeId}}">
      Employee Self Service Management
    </a>

    <div class="collapse navbar-collapse"
         id="navbarSupportedContent">

      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <li class="nav-item">

          <a class="nav-link"
             th:href="@{'/employees/empprofile/view/' + ${employee.employeeId}}">
            View Personal Details
          </a>

        </li>

        <li class="nav-item">

          <a class="nav-link"
             th:href="@{'/employees/leave/view/' + ${employee.employeeId}}">
            View Leave Details
          </a>

        </li>

        <li class="nav-item">

          <form th:action="@{/adminlogout}"
                method="post"
                style="display:inline;">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit"
                    class="nav-link btn btn-link"
                    style="color:white;
                                       text-decoration:none;
                                       border:none;
                                       padding:8px 16px;">

              Logout

            </button>

          </form>

        </li>

      </ul>

    </div>

  </div>

</nav>

</body>
</html>
